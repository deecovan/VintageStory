version: 10


############
## Добыча ##
############


# Позволяет изменять дополнения к добыче и изменения betterruins. Установите 0, чтобы полностью отключить их.
loot: 1 # from 0 to 10 (default: 1) 

# Регулирует процент шанса появления метеоритных блоков в BetterRuins. Установите на 100%, чтобы метеорит появлялся во всех подходящих блоках, или понизьте процент, чтобы контролировать его редкость. Установка на 0% полностью отключает появление метеоритов.
meteorvalue: 25 # from 0 to 100 (default: 25) 


#############
## Легенды ##
#############


# Позволяет включить или отключить генерацию контента лора в BetterRuins. Отключите, чтобы предотвратить генерацию.
lore: true #  (default: True) 


#################################
## Общая вероятность генерации ##
#################################


# Влияет на вероятность генерации всех структур (кроме деревень).
