#################
# https://github.com/NicIAss/betterruins/wiki/ruins#surface-entrance-ruins


# Определяет вероятность появления этой структуры (в пределах ее группы, если применимо). Более высокие значения увеличивают частоту появления.
surfaceunderground_spawn_chance: 1 # from 0 to 100 (default: 1) 

# Указывает минимальное расстояние, которое должно поддерживать данное сооружение от других сооружений в своей группе, измеряемое в блоках.
surfaceunderground_min_distance: 7500 # from 0 to 100000 (default: 7500) 


